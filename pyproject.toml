[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "bump-py-version"
version = "2.1.1"
description = "Bump a python version in python files. Create a new tag and push it to git repository."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "tomlkit==0.13.3",
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]
[[project.authors]]
name = "Dennis Iversen"
email = "dennis.iversen@gmail.com"

[project.urls]
Homepage = "https://github.com/diversen/bump-py-version"
Documentation = "https://github.com/diversen/bump-py-version"

[project.scripts]
bump-py-version = "bump_py_version.cli:cli"

[tool.black]
line-length = 140

[tool.mypy]
exclude = ["venv"]

[tool.bump_version]
version_file = "bump_py_version/__init__.py"
uv_lock = true
